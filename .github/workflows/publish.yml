name: 🐳 Build and Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "Makefile"
      - "LICENSE"
      - ".dockerignore"
      - "*.md"
  workflow_dispatch:
    inputs:
      allow_vulnerable_image:
        description: "Allow publishing when Trivy finds fixable HIGH or CRITICAL vulnerabilities"
        required: false
        default: false
        type: boolean

# One publish at a time, so each version-check sees the tags pushed by the
# previous run instead of racing it.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version-check:
    name: 🔒 Version Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Publishing moves latest and the minor and major tags, so a VERSION lower
      # than the latest release would move them backwards.
      - name: 🔒 Ensure version is newer than the latest release
        run: |
          VERSION=$(cat VERSION)
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION ${VERSION} is not in vX.Y.Z format."
            exit 1
          fi
          latest=$(git ls-remote --tags --refs origin 'v*' \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)
          if [ -z "$latest" ]; then
            echo "No previous release tag found."
          elif [ "$VERSION" = "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::VERSION ${VERSION} is not greater than the latest release ${latest}. Bump VERSION above ${latest}."
            exit 1
          else
            echo "VERSION ${VERSION} is greater than the latest release ${latest}."
          fi

      # Released version tags are immutable: fail before building rather than
      # overwrite an image that deployments or rollbacks may already pin.
      - name: 🔒 Ensure version tag is not published
        run: |
          VERSION=$(cat VERSION)
          url="https://hub.docker.com/v2/repositories/fayrus/syncret/tags/${VERSION}"
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "$url" || true)
          case "$status" in
            404)
              echo "Image tag ${VERSION} is not published yet."
              ;;
            200)
              echo "::error::Image tag fayrus/syncret:${VERSION} is already published. Bump VERSION before merging changes that publish an image."
              exit 1
              ;;
            *)
              echo "::error::Could not confirm that fayrus/syncret:${VERSION} is unpublished (Docker Hub returned HTTP ${status}). Re-run the workflow once Docker Hub responds."
              exit 1
              ;;
          esac

  build:
    name: 🔨 Build
    needs: version-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      digest: ${{ steps.digest.outputs.digest }}
      base_digest: ${{ steps.base.outputs.digest }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏷️ Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          {
            echo "version=$VERSION"
            echo "major=$(echo "$VERSION" | grep -oP 'v\d+')"
            echo "minor=$(echo "$VERSION" | grep -oP 'v\d+\.\d+')"
          } >> "$GITHUB_OUTPUT"

      - name: 🖥️ Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Chainguard free tier only serves `latest`, so the Dockerfile cannot
      # pin a digest. Resolve it once here and reuse it for every platform.
      - name: 🔎 Resolve runtime base digest
        id: base
        run: |
          digest=$(docker buildx imagetools inspect cgr.dev/chainguard/static:latest --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::Could not resolve the digest of cgr.dev/chainguard/static:latest (got '${digest}')."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Only the labels are used here. The single tag sets
      # org.opencontainers.image.version to the release (vX.Y.Z) instead of
      # `latest`; the publish job pushes and tags the image once the scans pass.
      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: fayrus/syncret
          tags: type=raw,value=${{ steps.version.outputs.version }}

      # Exported to an OCI archive instead of pushed: nothing reaches Docker Hub
      # until both scans pass.
      - name: 🔨 Build OCI archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          build-contexts: |
            cgr.dev/chainguard/static:latest=docker-image://cgr.dev/chainguard/static@${{ steps.base.outputs.digest }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The index digest is what the publish job pushes with --preserve-digests.
      - name: 🔎 Read image digest
        id: digest
        run: |
          digest=$(tar -xOf "${RUNNER_TEMP}/image.tar" index.json | jq -r '.manifests[0].digest')
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::Could not read the image index digest from the OCI archive (got '${digest}')."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload OCI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  security-scan:
    name: 🛡️ Security Scan (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📥 Download OCI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      # Trivy ignores --platform on a multi-arch OCI layout, so scan a layout
      # whose index points only to this platform's manifest (same blobs).
      - name: 🧩 Extract ${{ matrix.platform }} layout
        working-directory: ${{ runner.temp }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "layout-${ARCH}"
          tar -xf image.tar -C "layout-${ARCH}"
          cd "layout-${ARCH}" || exit 1
          index=$(jq -r '.manifests[0].digest' index.json)
          manifest=$(jq -c --arg arch "$ARCH" \
            '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | if length == 1 then .[0] else error("expected one linux/\($arch) manifest, found \(length)") end' \
            "blobs/sha256/${index#sha256:}")
          jq -n --argjson m "$manifest" '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: [$m]}' > index.json
          echo "linux/${ARCH} manifest: $(jq -r '.manifests[0].digest' index.json)"

      - name: 🛡️ Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/layout-${{ matrix.arch }}
          version: v0.76.2
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_vulnerable_image && '0' || '1' }}

      - name: 📤 Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.arch }}

  publish:
    name: 📦 Publish
    needs: [build, security-scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📥 Download OCI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      # First push to Docker Hub, only after both scans passed. --preserve-digests
      # keeps the scanned index digest; skopeo reads the docker login credentials.
      - name: 🚀 Push scanned image
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          skopeo copy --all --preserve-digests \
            "oci-archive:${RUNNER_TEMP}/image.tar" \
            "docker://docker.io/fayrus/syncret:${VERSION}"

      # Tags the scanned digest; nothing is rebuilt.
      - name: 🏷️ Tag scanned image
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          MINOR: ${{ needs.build.outputs.minor }}
          MAJOR: ${{ needs.build.outputs.major }}
        run: |
          docker buildx imagetools create \
            -t fayrus/syncret:latest \
            -t "fayrus/syncret:${MINOR}" \
            -t "fayrus/syncret:${MAJOR}" \
            "fayrus/syncret@${DIGEST}"

      - name: ✅ Verify published digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          published=$(docker buildx imagetools inspect "fayrus/syncret:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [[ "$published" != "$DIGEST" ]]; then
            echo "::error::fayrus/syncret:${VERSION} points to ${published}, not the scanned digest ${DIGEST}."
            exit 1
          fi
          echo "fayrus/syncret:${VERSION} points to the scanned digest ${DIGEST}."

      - name: 🔖 Create git tag
        id: git_tag
        run: |
          VERSION=$(cat VERSION)
          if ! git ls-remote --tags origin "$VERSION" | grep -q "$VERSION"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      # The Docker Hub page is written for operators (.github/DOCKERHUB.md), not
      # copied from the README, and is refreshed on every publish.
      - name: 📝 Update Docker Hub description
        id: dockerhub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: fayrus/syncret
          readme-filepath: ./.github/DOCKERHUB.md
          short-description: "Syncs dependent secrets and redeploys ECS services when an AWS Secrets Manager secret rotates"

      - name: 📋 Publish summary
        if: always()
        run: |
          {
            echo "## Publish summary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Version | ${{ needs.build.outputs.version }} |"
            echo "| Major tag | ${{ needs.build.outputs.major }} |"
            echo "| Minor tag | ${{ needs.build.outputs.minor }} |"
            echo "| Image | fayrus/syncret |"
            echo "| Published tags | latest, ${{ needs.build.outputs.version }}, ${{ needs.build.outputs.minor }}, ${{ needs.build.outputs.major }} |"
            echo "| Image digest (scanned and published) | ${{ needs.build.outputs.digest }} |"
            echo "| Runtime base digest | cgr.dev/chainguard/static@${{ needs.build.outputs.base_digest }} |"
            echo "| Git tag created | ${{ steps.git_tag.outputs.created }} |"
            echo "| Docker Hub description update | ${{ steps.dockerhub.outcome }} |"
            echo "| Vulnerable image override | ${{ github.event_name == 'workflow_dispatch' && inputs.allow_vulnerable_image || false }} |"
          } >> "$GITHUB_STEP_SUMMARY"
